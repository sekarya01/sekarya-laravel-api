---
# =============================================================================
#  Deploy otomatis lewat cPanel > Git Version Control
# =============================================================================
#  Dijalankan cPanel setiap kali "Deploy HEAD Commit" ditekan. Seluruh task
#  digabung jadi satu skrip bash, jadi `export` tetap berlaku di task berikutnya.
#
#  SETIAP TASK DIKUTIP TUNGGAL, DAN ITU WAJIB.
#
#  YAML membaca skalar tanpa kutip yang memuat titik-dua diikuti spasi sebagai
#  pasangan key/value, bukan string -- sehingga `echo "php     : $PHP"` merusak
#  seluruh daftar. Baris yang diawali tanda kutip ganda juga gagal diurai.
#  Ketika itu terjadi, cPanel TIDAK melaporkan galat: ia hanya menulis berkas
#  log kosong dan tidak menjalankan satu task pun. Gejalanya "Last Deployed:
#  Not available" tanpa keterangan apa pun.
#
#  Karena itu jangan menambah task tanpa kutip tunggal, dan setelah menyunting
#  berkas ini jalankan:
#
#      ruby -ryaml -e 'p YAML.load_file(".cpanel.yml")["deployment"]["tasks"]'
#
#  Seluruh entri harus tampil sebagai String. Kalau ada yang jadi Hash, cPanel
#  akan diam-diam tidak melakukan apa pun.
#
#  TIGA HAL YANG SENGAJA TIDAK DISENTUH:
#
#   1. `.env`      -- kredensial, tidak ada di git. Ditaruh manual sekali.
#   2. `vendor/`   -- tidak ada di git. Diunggah sekali, atau dibangun Composer.
#   3. `storage/`  -- unggahan pengguna dan log. Hanya foldernya dibuat.
#
#  `cp -R` dipakai, BUKAN `rsync --delete`: menyalin menimpa berkas bernama sama
#  tapi tidak pernah menghapus apa pun.
# =============================================================================

deployment:
  tasks:
    - 'export APP_ROOT="$HOME/sekarya"'
    - 'export SRC="$(pwd)"'
    - 'export PHP="$(command -v ea-php84 || echo /opt/cpanel/ea-php84/root/usr/bin/php)"'
    - 'export DOCROOT="$HOME/public_html"'
    - 'echo "=== Deploy Sekarya API ==="'
    - 'echo "sumber  = $SRC"'
    - 'echo "tujuan  = $APP_ROOT"'
    - 'echo "php     = $PHP"'

    # Struktur folder, tanpa menghapus apa pun
    - '/bin/mkdir -p "$APP_ROOT"'
    - '/bin/mkdir -p "$APP_ROOT/storage/app/private"'
    - '/bin/mkdir -p "$APP_ROOT/storage/app/public"'
    - '/bin/mkdir -p "$APP_ROOT/storage/framework/cache/data"'
    - '/bin/mkdir -p "$APP_ROOT/storage/framework/sessions"'
    - '/bin/mkdir -p "$APP_ROOT/storage/framework/views"'
    - '/bin/mkdir -p "$APP_ROOT/storage/logs"'
    - '/bin/mkdir -p "$APP_ROOT/bootstrap/cache"'

    # Kode aplikasi. storage/, tests/, dan docs/ tidak ikut.
    - '/bin/cp -R "$SRC/app" "$APP_ROOT/"'
    - '/bin/cp -R "$SRC/bootstrap" "$APP_ROOT/"'
    - '/bin/cp -R "$SRC/config" "$APP_ROOT/"'
    - '/bin/cp -R "$SRC/database" "$APP_ROOT/"'
    - '/bin/cp -R "$SRC/public" "$APP_ROOT/"'
    - '/bin/cp -R "$SRC/resources" "$APP_ROOT/"'
    - '/bin/cp -R "$SRC/routes" "$APP_ROOT/"'
    - '/bin/cp "$SRC/artisan" "$APP_ROOT/"'
    - '/bin/cp "$SRC/composer.json" "$APP_ROOT/"'
    - '/bin/cp "$SRC/composer.lock" "$APP_ROOT/"'

    # 755, bukan 777: PHP berjalan sebagai pengguna akun ini sendiri.
    - '/bin/chmod -R 755 "$APP_ROOT/storage" "$APP_ROOT/bootstrap/cache"'

    # ── Titik masuk web di public_html ──────────────────────────────────────
    # Domain utama cPanel dilayani dari ~/public_html dan document root-nya
    # tidak bisa diubah dari panel. Jadi HANYA isi public/ yang ditaruh di
    # situ -- kode aplikasi tetap di ~/sekarya, di luar jangkauan web.
    #
    # index.php mencari ../vendor dan ../bootstrap relatif terhadap dirinya.
    # Dari public_html itu menunjuk ke ~/vendor yang tidak ada, jadi ketiga
    # path-nya ditulis ulang menjadi ../sekarya/...
    #
    # Berkasnya disalin ULANG dari repo setiap deploy sebelum ditulis ulang,
    # dan regex-nya memakai negative lookahead (?!sekarya/) -- tanpa itu,
    # deploy kedua menghasilkan ../sekarya/sekarya/ dan situs mati.
    - '/bin/mkdir -p "$DOCROOT"'
    - '/bin/cp "$SRC/public/index.php" "$DOCROOT/index.php"'
    - '/bin/cp "$SRC/public/.htaccess" "$DOCROOT/.htaccess"'
    - '/bin/cp "$SRC/public/favicon.ico" "$DOCROOT/favicon.ico"'
    - '/bin/cp "$SRC/public/robots.txt" "$DOCROOT/robots.txt"'
    - 'perl -pi -e "s{__DIR__\.''/\.\./(?!sekarya/)}{__DIR__.''/../sekarya/}g" "$DOCROOT/index.php"'
    - 'echo "titik masuk web = $DOCROOT/index.php"'
    - 'grep -c sekarya/vendor "$DOCROOT/index.php" >/dev/null || { echo "GAGAL - penulisan ulang path index.php tidak berhasil"; exit 1; }'

    # Composer kalau ada; kalau tidak, vendor/ yang sudah diunggah tetap dipakai
    # dan deploy TIDAK digagalkan.
    - 'cd "$APP_ROOT"'
    - 'if command -v composer >/dev/null 2>&1; then echo "composer ada, menyegarkan vendor"; composer install --no-dev --optimize-autoloader --no-interaction; else echo "composer tidak ada, memakai vendor yang sudah diunggah"; fi'

    # Berhenti dengan pesan jelas kalau prasyaratnya belum ada
    - 'if [ ! -f "$APP_ROOT/vendor/autoload.php" ]; then echo "GAGAL - $APP_ROOT/vendor belum ada. Unggah sekarya-vendor-laravel11.zip lalu ekstrak di situ."; exit 1; fi'
    - 'if [ ! -f "$APP_ROOT/.env" ]; then echo "GAGAL - $APP_ROOT/.env belum ada. Unggah .env.sekarya-produksi ke situ dengan nama .env"; exit 1; fi'

    # Cache. Di PHP 8.5 config:cache BUKAN optimasi melainkan syarat: tanpanya
    # Laravel 11 menyisipkan peringatan deprecated ke badan setiap respons JSON.
    # optimize:clear dan config:cache SATU RANGKAIAN.
    - '"$PHP" artisan optimize:clear'
    - '"$PHP" artisan config:cache'
    - '"$PHP" artisan route:cache'
    - '"$PHP" artisan view:cache'
    - '"$PHP" artisan event:cache'
    # Symlink storage publik, dibuat dengan ln alih-alih `artisan storage:link`.
    # Di hosting ini `exec()` dimatikan lewat disable_functions, sehingga
    # storage:link berhenti dengan "Call to undefined function exec()".
    # Dibutuhkan karena avatar disajikan lewat Storage::disk('public')->url().
    - '/bin/ln -sfn "$APP_ROOT/storage/app/public" "$DOCROOT/storage"'

    # --force wajib di produksi, tanpanya artisan bertanya dan deploy menggantung.
    # Pemasangan pertama lewat sekarya-install.sql, jadi biasanya "Nothing to migrate".
    - '"$PHP" artisan migrate --force'

    - 'echo "=== Selesai. Uji dengan - curl -i https://sekarya.com/api/v1/categories ==="'
